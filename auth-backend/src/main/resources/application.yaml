server:
  forward-headers-strategy: framework
  port: 8087

spring:
  application:
    name: auth-backend
  web:
    cors:
      max-age: 3600
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=authdb}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: authdb
  flyway:
    enabled: true
    default-schema: authdb
    schemas: authdb
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    path: logs
    name: logs/auth-backend.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.javaproject.application: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  loki:
    url: ${LOKI_URL:http://localhost:3100}

app:
  oauth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:true}
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
      jwk-set-uri: ${GOOGLE_OAUTH_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuer: ${GOOGLE_OAUTH_ISSUER:https://accounts.google.com}
  jwt:
    private-key-path: keys/jwt-private.pem
    public-key-path: keys/jwt-public.pem
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
    issuer: auth-backend
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174
    max-age-seconds: 3600
  cookie:
    domain:                                  # leave empty for localhost
    secure: false                            # set true in production (HTTPS)
    same-site: Lax                           # Lax for dev, Strict for production
    path: /
  auth:
    default-method: JWT
  security:
    policy:
      enable: DEFAULT
    password:
      algo: BCRYPT
  notifications:
    exchange: notifications.events
    routing-key:
      email: email.send
      sms: sms.send
    service:
      base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
  user-events:
    exchange: ${USER_EVENTS_EXCHANGE:auth.user.events}
    registration-otp:
      backend: auto
      expiry-minutes: 10
      max-attempts: 5
      cooldown-minutes: 15
      resend-cooldown-seconds: 60
      redis-failures-threshold: 3
      redis-circuit-open-seconds: 30
      cleanup:
        enabled: true
        fixed-delay-ms: 900000
        retention-hours: 24
    login-otp:
      max-attempts: 5
      cooldown-minutes: 15

cache:
  local:
    ttl-minutes: 10
    max-size: 100
  redis:
    ttl-minutes: 30
