server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: ai-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: aidb
    open-in-view: false

  flyway:
    enabled: true
    default-schema: aidb
    schemas: aidb
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: splitydb
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none

ai:
  provider: ${AI_PROVIDER:openai}   # "claude" or "openai"
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}
    base-url: https://api.anthropic.com
    max-tokens: 1500
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: https://api.openai.com
    max-tokens: 1500
  splitwise:
    base-url: ${SPLITWISE_BACKEND_URL:http://localhost:8081}
  document-service:
    base-url: ${DOCUMENT_SERVICE_URL:http://localhost:8084}
  bot:
    user-id: ${SPLITY_BOT_USER_ID:00000000-0000-0000-0000-000000000099}
    email: splity@splitmoney.ai
  conversation:
    ttl-minutes: 30

app:
  jwt:
    public-key-path: ${APP_JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}
    issuer: ${APP_JWT_ISSUER:auth-backend}

langfuse:
  enabled: ${LANGFUSE_ENABLED:true}
  base-url: ${LANGFUSE_URL:http://localhost:3002}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  loki:
    url: ${LOKI_URL:http://localhost:3100}

