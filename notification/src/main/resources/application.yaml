server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: Notification-App
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=notificationdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:notificationdb}
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:notificationdb}
    default-schema: ${DB_SCHEMA:notificationdb}
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 100
        concurrency: 2
        max-concurrency: 6
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    path: ${LOG_DIR:logs}
  level:
    root: ${LOG_LEVEL:INFO}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:50MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:5GB}
  loki:
    url: ${LOKI_URL:http://localhost:3100}

notification:
  splitwise:
    exchange: ${SPLITWISE_EVENT_EXCHANGE:splitwise.events}
    queue: ${SPLITWISE_EVENT_QUEUE:notifications.splitwise.main}
    dlq: ${SPLITWISE_EVENT_DLQ:notifications.splitwise.dlq}
    routing-key-group-member-added: ${SPLITWISE_EVENT_KEY_GROUP_MEMBER_ADDED:group.member.added}
    routing-key-group-member-removed: ${SPLITWISE_EVENT_KEY_GROUP_MEMBER_REMOVED:group.member.removed}
    routing-key-expense-added-against-user: ${SPLITWISE_EVENT_KEY_EXPENSE_ADDED_AGAINST_USER:expense.added.against_user}
  email:
    provider: ${EMAIL_PROVIDER:gmail}
    from-address: ${MAIL_FROM:${MAIL_USERNAME}}
  features:
    in-app-enabled: true
    email-enabled: true
    email-canary-percent: 0
  queue:
    exchange: notifications.events
    in-app:
      main: notifications.inapp.main
      dlq: notifications.inapp.dlq
      retry-1m: notifications.inapp.retry.1m
      retry-5m: notifications.inapp.retry.5m
      retry-15m: notifications.inapp.retry.15m
      retry-60m: notifications.inapp.retry.60m
    email:
      main: notifications.email.main
      dlq: notifications.email.dlq
      retry-1m: notifications.email.retry.1m
      retry-5m: notifications.email.retry.5m
      retry-15m: notifications.email.retry.15m
      retry-60m: notifications.email.retry.60m
  routing:
    in-app: inapp.created
    email: email.send
  retry:
    max-attempts: 5
    delays-seconds: 60,300,900,3600
    default-delay-seconds: 60
  domain:
    default-tenant: default
    outbox-aggregate-type: notification
    outbox-event-type: NotificationMessage
  outbox:
    fixed-delay-ms: 3000
    batch-size: 100

app:
  jwt:
    public-key-path: ${APP_JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}
    issuer: ${APP_JWT_ISSUER:auth-backend}
