server:
  port: ${CHAT_SERVICE_PORT:8085}

spring:
  application:
    name: chat-service

  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: ${CASSANDRA_KEYSPACE:chatdb}
    local-datacenter: ${CASSANDRA_DC:datacenter1}
    schema-action: none

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: chat-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.splitmoney.chat.dto"
        spring.json.value.default.type: "com.splitmoney.chat.dto.ChatMessageEvent"

app:
  jwt:
    public-key-path: ${APP_JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}
    issuer: ${APP_JWT_ISSUER:auth-backend}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

chat:
  kafka:
    topic: ${CHAT_KAFKA_TOPIC:chat.messages}
  presence:
    ttl-seconds: ${CHAT_PRESENCE_TTL:30}
  typing:
    ttl-seconds: ${CHAT_TYPING_TTL:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  loki:
    url: ${LOKI_URL:http://localhost:3100}
